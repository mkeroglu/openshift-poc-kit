# (Pod) affinity: place the cache VM on the SAME node as web-1
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cache-1
  namespace: ocp-poc-virt
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small              # 1 vCPU / 2Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: cache-1-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: poc-cache
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vm.kubevirt.io/name: web-1   # label KubeVirt puts on virt-launcher pods automatically
              topologyKey: kubernetes.io/hostname
      domain:
        devices: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: cache-1-rootdisk
