# Pin the VM to a specific node with nodeSelector
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: sched-nodeselector
  namespace: ocp-poc-virt
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small              # 1 vCPU / 2Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: sched-nodeselector-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: poc-sched
    spec:
      nodeSelector:
        kubernetes.io/hostname: REPLACE_ME_NODE   # oc get nodes
      domain:
        devices: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: sched-nodeselector-rootdisk
