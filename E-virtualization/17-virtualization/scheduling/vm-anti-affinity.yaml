# Anti-affinity: 4 web VMs, 3 nodes labeled REPLACE_ME_POOL_LABEL -> 3 run on different nodes, the 4th stays Pending
# (With N labeled nodes, N+1 VMs give the same result.)
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: web-1
  namespace: ocp-poc-virt
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small              # 1 vCPU / 2Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: web-1-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: poc-web
    spec:
      affinity:
        nodeAffinity:                       # only nodes labeled REPLACE_ME_POOL_LABEL
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: REPLACE_ME_POOL_LABEL
                    operator: Exists
        podAntiAffinity:                    # two VMs labeled app=poc-web can NOT land on the same node
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: poc-web
              topologyKey: kubernetes.io/hostname
      domain:
        devices: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: web-1-rootdisk
