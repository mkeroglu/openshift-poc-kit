# Network that connects VMs to a corporate VLAN through a Linux bridge on the nodes.
#   REPLACE_ME_BRIDGE  : name of the Linux bridge created on the nodes with NNCP (e.g. br-vm)
#   REPLACE_ME_VLAN_ID : VLAN ID the VMs connect to (the bridge's physical port must be a trunk on the switch)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-vlan
  namespace: ocp-poc-virt
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/REPLACE_ME_BRIDGE
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vm-vlan",
      "type": "bridge",
      "bridge": "REPLACE_ME_BRIDGE",
      "vlan": REPLACE_ME_VLAN_ID,
      "macspoofchk": true,
      "ipam": {}
    }
