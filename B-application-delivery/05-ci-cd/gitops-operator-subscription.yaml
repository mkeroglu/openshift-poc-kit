# FOR REFERENCE ONLY: this operator is a resource that affects the whole cluster (all namespaces).
# Before applying, check whether the operator is already installed:
#   oc get csv -A | grep -i gitops
#   oc get ns openshift-gitops openshift-gitops-operator
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-operators
spec:
  channel: latest
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
