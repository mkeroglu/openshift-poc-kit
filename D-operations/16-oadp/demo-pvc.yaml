# demo-pvc.yaml
# To show that persistent disk (PVC) data is backed up and restored too: a PVC + a single-replica app writing to it
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: poc-oadp-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-app
  namespace: poc-oadp-demo
  labels: {app: data-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: data-app}}
  template:
    metadata: {labels: {app: data-app}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data-pvc}
